[project]
name = "zorvi-backend"
version = "0.1.0"
description = "ZORVI — Learn. Create. Launch. Backend service."
authors = [{ name = "Ibrahim Talib" }]
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"
